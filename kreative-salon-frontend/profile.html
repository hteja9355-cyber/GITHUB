<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kreative Salon | My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="protected">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Kreative Salon</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto" id="navbarLinks">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
          <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html">My Profile</a></li>
        </ul>
        <a href="login.html" class="btn btn-outline-light ms-lg-3" id="logoutBtn">Logout</a>
      </div>
    </div>
  </nav>

  <section class="py-5 bg-light">
    <div class="container">
      <div class="row g-4 justify-content-center">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
              <h1 class="fw-bold mb-3">My Profile</h1>
              <p class="text-muted">Manage your account details and view your booking history.</p>

              <div class="alert alert-success d-none" id="profileSuccess"></div>
              <div class="alert alert-danger d-none" id="profileError"></div>

              <form id="profileForm" class="mt-4">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="profileName" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="profileEmail" disabled>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="profilePhone">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Role</label>
                    <input type="text" class="form-control" id="profileRole" disabled>
                  </div>
                </div>

                <div class="mt-4">
                  <button class="btn btn-primary px-4" type="submit">Update Profile</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Booking History -->
      <div class="row g-4 mt-4">
        <div class="col-12">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
              <h3 class="fw-bold mb-4">My Booking History</h3>
              <div id="allBookingsList" class="row g-4"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    async function loadProfile() {
      const successMsg = document.getElementById("profileSuccess");
      const errorMsg = document.getElementById("profileError");

      try {
        const response = await fetch("http://localhost:5003/api/auth/me", {
          headers: {
            "Authorization": localStorage.getItem("authToken") ? `Bearer ${localStorage.getItem("authToken")}` : ""
          }
        });

        if (!response.ok) {
          throw new Error("Failed to load profile");
        }

        const user = await response.json();

        document.getElementById("profileName").value = user.name || "";
        document.getElementById("profileEmail").value = user.email || "";
        document.getElementById("profilePhone").value = user.phone || "";
        document.getElementById("profileRole").value = user.role || "user";
      } catch (error) {
        console.error("Error loading profile:", error);
        errorMsg.classList.remove("d-none");
        errorMsg.textContent = "Failed to load profile. Please login again.";
      }
    }

    async function updateProfile(e) {
      e.preventDefault();

      const successMsg = document.getElementById("profileSuccess");
      const errorMsg = document.getElementById("profileError");

      const name = document.getElementById("profileName").value.trim();
      const phone = document.getElementById("profilePhone").value.trim();

      if (!name) {
        errorMsg.classList.remove("d-none");
        errorMsg.textContent = "Name is required";
        return;
      }

      try {
        const response = await fetch("http://localhost:5003/api/auth/profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": localStorage.getItem("authToken") ? `Bearer ${localStorage.getItem("authToken")}` : ""
          },
          body: JSON.stringify({ name, phone })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Failed to update profile");
        }

        successMsg.classList.remove("d-none");
        successMsg.textContent = "Profile updated successfully!";

        setTimeout(() => {
          successMsg.classList.add("d-none");
        }, 3000);
      } catch (error) {
        console.error("Error updating profile:", error);
        errorMsg.classList.remove("d-none");
        errorMsg.textContent = error.message || "Failed to update profile";
      }
    }

    async function loadAllBookings() {
      const bookingsList = document.getElementById("allBookingsList");

      try {
        const response = await fetch("http://localhost:5003/api/bookings/my", {
          headers: {
            "Authorization": localStorage.getItem("authToken") ? `Bearer ${localStorage.getItem("authToken")}` : ""
          }
        });
        const bookings = await response.json();

        if (!response.ok) {
          throw new Error("Failed to load bookings");
        }

        bookingsList.innerHTML = "";

        if (!bookings.length) {
          bookingsList.innerHTML = `
            <div class="col-12">
              <div class="alert alert-warning">No bookings found.</div>
            </div>
          `;
          return;
        }

        bookings.forEach((booking) => {
          const servicesText = Array.isArray(booking.services)
            ? booking.services.join(", ")
            : "N/A";

          const totalText = booking.totalAmount ? `₹${booking.totalAmount}` : "₹0";
          const dateText = booking.appointmentDate || "N/A";
          const timeText = booking.appointmentTime || "N/A";

          const statusBadge = booking.status === 'confirmed' 
            ? '<span class="badge bg-success">Confirmed</span>'
            : '<span class="badge bg-warning text-dark">Pending</span>';

          const card = document.createElement("div");
          card.className = "col-md-6";

          card.innerHTML = `
            <div class="card border-0 shadow-sm rounded-4 h-100">
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start mb-3">
                  ${statusBadge}
                  <span class="badge bg-primary">${totalText}</span>
                </div>
                <p class="mb-2"><strong>Services:</strong> ${servicesText}</p>
                <p class="mb-2"><strong>Date:</strong> ${dateText}</p>
                <p class="mb-0"><strong>Time:</strong> ${timeText}</p>
              </div>
            </div>
          `;

          bookingsList.appendChild(card);
        });
      } catch (error) {
        console.error("Error loading bookings:", error);
        bookingsList.innerHTML = `
          <div class="col-12">
            <div class="alert alert-danger">Failed to load bookings.</div>
          </div>
        `;
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await Auth.initAuth();
      loadProfile();
      loadAllBookings();

      document.getElementById("profileForm").addEventListener("submit", updateProfile);

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("authToken");
        localStorage.removeItem("userRole");
        window.location.href = "login.html";
      });
    });
  </script>
</body>
</html>
