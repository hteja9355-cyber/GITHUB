<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kreative Salon | My Bookings</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="protected">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Kreative Salon</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggling-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto" id="navbarLinks">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
          <li class="nav-item"><a class="nav-link active" href="my-bookings.html">My Bookings</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 bg-light">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 class="fw-bold mb-1">My Bookings</h1>
          <p class="text-muted mb-0">Your bookings are loaded from the database.</p>
        </div>
        <a href="booking.html" class="btn btn-primary">Book New Appointment</a>
      </div>

      <div id="bookingsList" class="row g-4"></div>
    </div>
  </section>

  <script src="assets/js/auth.js"></script>
  <script>
async function loadBookings() {
      const bookingsList = document.getElementById("bookingsList");

      bookingsList.innerHTML = `
        <div class="col-12">
          <div class="alert alert-info">Loading bookings...</div>
        </div>
      `;

      try {
        const response = await fetch("http://localhost:5003/api/bookings/my", {
          headers: {
            "Authorization": localStorage.getItem("authToken") ? `Bearer ${localStorage.getItem("authToken")}` : ""
          }
        });
        const bookings = await response.json();

        if (!response.ok) {
          throw new Error(bookings.message || "Failed to load bookings");
        }

        bookingsList.innerHTML = "";

        // Filter only confirmed bookings
        const confirmedBookings = bookings.filter(b => b.status === 'confirmed');

        if (!confirmedBookings.length) {
          bookingsList.innerHTML = `
            <div class="col-12">
              <div class="alert alert-warning">No confirmed bookings found. Your booking requests will appear here once confirmed by the admin.</div>
            </div>
          `;
          return;
        }

        confirmedBookings.forEach((booking) => {
          const servicesText = Array.isArray(booking.services)
            ? booking.services.join(", ")
            : "N/A";

          const totalText = booking.totalAmount ? `₹${booking.totalAmount}` : "₹0";
          const nameText = booking.name || "Customer";
          const phoneText = booking.phone || "N/A";
          const dateText = booking.appointmentDate || "N/A";
          const timeText = booking.appointmentTime || "N/A";
          const notesText = booking.notes || "";

          const card = document.createElement("div");
          card.className = "col-md-6";

          const statusBadge = booking.status === 'confirmed' 
            ? '<span class="badge bg-success fs-6">Confirmed</span>'
            : '<span class="badge bg-warning text-dark fs-6">Pending</span>';

          card.innerHTML = `
            <div class="card border-0 shadow-sm rounded-4 h-100">
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start mb-3">
                  <h3 class="fw-bold mb-0">${nameText}</h3>
                  <div class="d-flex gap-2">
                    ${statusBadge}
                    <span class="badge bg-primary fs-6">${totalText}</span>
                  </div>
                </div>

                <p class="mb-2"><strong>Services:</strong> ${servicesText}</p>
                <p class="mb-2"><strong>Date:</strong> ${dateText}</p>
                <p class="mb-2"><strong>Time:</strong> ${timeText}</p>
                <p class="mb-2"><strong>Phone:</strong> ${phoneText}</p>
                ${notesText ? `<p class="mb-0"><strong>Notes:</strong> ${notesText}</p>` : ""}
              </div>
            </div>
          `;

          bookingsList.appendChild(card);
        });
      } catch (error) {
        console.error("Error loading bookings:", error);
        bookingsList.innerHTML = `
          <div class="col-12">
            <div class="alert alert-danger">Failed to load bookings from server.</div>
          </div>
        `;
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      if (window.Auth) {
        await Auth.initAuth();
      }
      loadBookings();
    });
  </script>
</body>
</html>
