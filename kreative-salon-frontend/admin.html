<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kreative Salon | Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />

</head>
<body class="protected admin-protected">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Kreative Salon</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">S
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav ms-auto" id="navbarLinks">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
          <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
        </ul>
        <a href="login.html" class="btn btn-outline-light ms-lg-3">Login</a>
      </div>
    </div>
  </nav>

  <section class="py-5 bg-light">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 class="fw-bold mb-1">Admin Dashboard</h1>
          <p class="text-muted mb-0">Simple frontend dashboard for salon owner/staff.</p>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-md-4"><div class="stat-card stat-big"><h3 id="adminTotalBookings">0</h3><p>Total Bookings</p></div></div>
        <div class="col-md-4"><div class="stat-card stat-big"><h3 id="adminTodayBookings">0</h3><p>Today&apos;s Bookings</p></div></div>
        <div class="col-md-4"><div class="stat-card stat-big"><h3 id="adminTotalRevenue">₹0</h3><p>Expected Revenue</p></div></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0">Manage Services</h4>
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addServiceModal">
                  + Add Service
                </button>
              </div>
              <div id="adminServiceList" class="list-group"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
              <h4 class="fw-bold mb-3">Recent Bookings</h4>
              <div class="table-responsive">
                <table class="table align-middle">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Services</th>
                      <th>Date</th>
                      <th>Time</th>
                      <th>Total</th>
                    </tr>
                  </thead>
                  <tbody id="adminBookingsTable"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Add Service Modal -->
  <div class="modal fade" id="addServiceModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Add New Service</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addServiceForm">
            <div class="mb-3">
              <label class="form-label">Service Name</label>
              <input type="text" class="form-control" id="serviceName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Price (₹)</label>
              <input type="number" class="form-control" id="servicePrice" min="0" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Duration (Minutes)</label>
              <input type="number" class="form-control" id="serviceDuration" min="5" value="30" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description (Optional)</label>
              <textarea class="form-control" id="serviceDescription" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Service</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    window.addEventListener('load', async () => {
      await Auth.initAuth();
      if (window.renderAdmin) {
        renderAdmin();
      }
    });

    document.getElementById("addServiceForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";

      const data = {
        name: document.getElementById("serviceName").value.trim(),
        price: Number(document.getElementById("servicePrice").value),
        durationMinutes: Number(document.getElementById("serviceDuration").value),
        description: document.getElementById("serviceDescription").value.trim()
      };

      try {
        await addService(data);
        
        // Hide modal
        const modalEl = document.getElementById('addServiceModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();

        // Reset form
        e.target.reset();

        // Refresh data
        await fetchServices();
        renderAdmin();
        
        alert("Service added successfully!");
      } catch (err) {
        alert(err.message || "Failed to add service");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Save Service";
      }
    });
  </script>
</body>
</html>
